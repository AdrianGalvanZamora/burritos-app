<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Control Financiero</title>
    <meta name="description" content="Gestión de finanzas personales, tarjetas de crédito y gastos con estilo pirata.">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
    
    <style>
        /* Estilos base optimizados */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #e2e8f0; 
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            width: 100%; 
            transition: background-color 0.5s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .wallpaper-container {
            position: fixed; inset: 0; z-index: 0; opacity: 0.15; pointer-events: none;
            background-size: cover; background-position: center; transition: opacity 0.5s;
        }

        /* Pantalla de bloqueo */
        #pin-lock-screen {
            position: fixed; inset: 0; background-color: #0f172a; z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.3s ease-in-out;
        }
        .pin-dot { width: 15px; height: 15px; border-radius: 50%; background-color: #334155; transition: background-color 0.2s; }
        .pin-dot.active { background-color: var(--accent-color, #22d3ee); box-shadow: 0 0 10px var(--accent-color, #22d3ee); }

        header, main { position: relative; z-index: 10; }

        /* Tarjetas */
        .card-base {
            background-size: cover; background-position: center; background-repeat: no-repeat;
            border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            position: relative; overflow: hidden; 
        }
        
        /* Modales */
        .modal { transition: opacity 0.2s ease; }
        body.modal-active { overflow: hidden; }
        .text-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* Botón Flotante */
        #draggable-fab-container {
            position: fixed; z-index: 100; cursor: pointer; touch-action: none; user-select: none;
            transition: transform 0.1s;
        }
        #draggable-fab-container:active { transform: scale(0.90); }
        #draggable-fab-container svg { pointer-events: none; }

        /* Utilidades */
        .blur-text { filter: blur(4px); user-select: none; }
        .input-dark { background-color: #1e293b; border-color: #334155; color: white; }
        .input-dark:focus { border-color: var(--accent-color, #22d3ee); outline: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.1); }
        .cat-radio:checked + label { background-color: var(--accent-color, #22d3ee); color: #0f172a; border-color: var(--accent-color, #22d3ee); }
        .fab-option.selected { border-color: var(--accent-color); background-color: rgba(255,255,255,0.1); }

        /* Tema Dinámico */
        :root { --accent-color: #22d3ee; }
        body.theme-couple { --accent-color: #f43f5e; } 
        .text-accent { color: var(--accent-color) !important; }
        .bg-accent { background-color: var(--accent-color) !important; }
        .border-accent { border-color: var(--accent-color) !important; }
        
        /* Contenido Educativo */
        .academy-article h4 { color: var(--accent-color); font-weight: bold; margin-bottom: 0.5rem; margin-top: 1rem; }
        .academy-article p { font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 0.5rem; }
        .academy-article ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; font-size: 0.9rem; }
        .academy-article strong { color: white; }
    </style>
</head>
<body class="text-gray-200 pb-28 transition-colors duration-500">

    <div id="pin-lock-screen" aria-hidden="true">
        <div class="mb-8 text-center"><i class="fa-solid fa-shield-halved text-6xl text-slate-700 mb-4 animate-pulse"></i><h2 class="text-2xl font-bold text-white font-[Pirata One] tracking-wider">Acceso Restringido</h2><p class="text-slate-500 text-sm mt-2">Ingresa tu PIN</p></div>
        <div class="flex gap-4 mb-8"><div class="pin-dot" id="dot-1"></div><div class="pin-dot" id="dot-2"></div><div class="pin-dot" id="dot-3"></div><div class="pin-dot" id="dot-4"></div></div>
        <div class="grid grid-cols-3 gap-6">
            <button aria-label="1" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(1)">1</button>
            <button aria-label="2" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(2)">2</button>
            <button aria-label="3" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(3)">3</button>
            <button aria-label="4" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(4)">4</button>
            <button aria-label="5" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(5)">5</button>
            <button aria-label="6" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(6)">6</button>
            <button aria-label="7" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(7)">7</button>
            <button aria-label="8" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(8)">8</button>
            <button aria-label="9" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(9)">9</button>
            <button class="w-16 h-16 rounded-full bg-transparent"></button> 
            <button aria-label="0" class="w-16 h-16 rounded-full bg-slate-800 text-xl font-bold text-white border border-slate-700 active:scale-95" onclick="enterDigit(0)">0</button>
            <button aria-label="Borrar dígito" class="w-16 h-16 rounded-full bg-transparent text-xl font-bold text-red-400 active:scale-95 flex items-center justify-center" onclick="deleteDigit()"><i class="fa-solid fa-delete-left"></i></button>
        </div>
        <div class="mt-8"><button onclick="unlockApp()" class="text-slate-700 text-xs">Omitir (Emergency)</button></div>
    </div>

    <div class="wallpaper-container" id="app-wallpaper">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" id="default-pattern">
            <defs>
                <pattern id="seigaiha" x="0" y="0" width="100" height="50" patternUnits="userSpaceOnUse">
                    <g fill="none" stroke="currentColor" stroke-width="2" class="text-slate-700 opacity-50">
                        <circle cx="50" cy="60" r="40" /><circle cx="50" cy="60" r="30" /><circle cx="50" cy="60" r="20" />
                        <circle cx="0" cy="35" r="40" /><circle cx="0" cy="35" r="30" /><circle cx="0" cy="35" r="20" />
                        <circle cx="100" cy="35" r="40" /><circle cx="100" cy="35" r="30" /><circle cx="100" cy="35" r="20" />
                    </g>
                </pattern>
            </defs>
            <rect x="0" y="0" width="100%" height="100%" fill="url(#seigaiha)" />
        </svg>
    </div>

    <header class="bg-slate-900/90 backdrop-blur-md shadow-lg sticky top-0 border-b border-slate-800 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <button onclick="toggleModal('modal-profiles')" aria-label="Cambiar Perfil" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-full transition border border-slate-700 shadow-sm min-w-[110px] justify-between">
                <div class="flex items-center gap-2"><i id="profile-icon" class="fa-solid fa-user text-accent text-sm"></i><span id="profile-label" class="text-xs font-bold text-white">Personal</span></div>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-500"></i>
            </button>
            <div class="flex items-center gap-3">
                <button onclick="toggleModal('modal-academy')" aria-label="Abrir Academia" class="text-slate-300 hover:text-white transition" title="Academia"><i class="fa-solid fa-graduation-cap text-lg"></i></button>
                <button onclick="toggleModal('modal-calculator')" aria-label="Abrir Calculadora" class="text-slate-300 hover:text-white transition"><i class="fa-solid fa-calculator text-lg"></i></button>
                <button onclick="openSettings()" aria-label="Abrir Ajustes" class="text-slate-300 hover:text-white transition"><i class="fa-solid fa-gear text-lg"></i></button>
                <button onclick="togglePrivacy()" id="btn-privacy" aria-label="Ocultar o mostrar saldos" class="text-slate-300 hover:text-white transition"><i class="fa-regular fa-eye text-lg"></i></button>
                <button onclick="openAddModal()" aria-label="Agregar Nueva Cuenta" class="text-xs text-slate-900 font-bold bg-accent px-3 py-1.5 rounded-full transition shadow-lg opacity-90 hover:opacity-100 flex items-center"><i class="fa-solid fa-plus mr-1"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
        <div class="bg-slate-800/80 backdrop-blur-sm rounded-xl shadow-lg p-4 border border-slate-700 relative">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center" id="balance-title">Balance Personal</h2>
            <div class="flex flex-row items-center justify-between gap-4">
                <div class="w-1/2 relative h-32">
                    <canvas id="financeChart"></canvas>
                    <div class="absolute inset-0 flex items-center justify-center flex-col pointer-events-none"><span class="text-[10px] text-slate-500">Neto</span><span id="total-net" class="text-xs font-bold text-white amount-display">$0</span></div>
                </div>
                <div class="w-1/2 flex flex-col justify-center gap-3">
                    <div class="border-l-4 border-red-500 pl-3"><p class="text-[10px] text-slate-400 uppercase">Deuda</p><p id="total-debt" class="text-lg font-black text-white amount-display">$0.00</p></div>
                    <div class="border-l-4 border-green-500 pl-3"><p class="text-[10px] text-slate-400 uppercase">Activos</p><p id="total-invest" class="text-lg font-black text-white amount-display">$0.00</p></div>
                </div>
            </div>
        </div>
        <div id="cards-container" class="space-y-4"></div>
    </main>

    <div id="draggable-fab-container" style="right: 20px; bottom: 80px;"></div>

    <div id="modal-academy" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleModal('modal-academy')"></div>
        <div class="bg-slate-800 w-11/12 md:max-w-md rounded-xl shadow-2xl z-50 border border-slate-700 h-[80vh] flex flex-col relative overflow-hidden">
            <div class="py-4 px-6 border-b border-slate-700 flex justify-between items-center bg-slate-900 rounded-t-xl z-10">
                <div><p class="text-xs font-bold text-slate-500 uppercase">Educación</p><h3 class="text-xl font-bold text-white font-[Pirata One]">La Academia</h3></div>
                <button onclick="toggleModal('modal-academy')" aria-label="Cerrar academia" class="text-slate-500 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 relative" id="academy-content">
                </div>
        </div>
    </div>

    <div id="modal-profiles" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleModal('modal-profiles')"></div>
        <div class="bg-slate-800 w-11/12 md:max-w-xs rounded-xl shadow-2xl z-50 border border-slate-700 relative py-5 px-4 text-left">
            <h3 class="text-lg font-bold text-white mb-4 px-2">Cambiar Perfil</h3>
            <div class="space-y-2">
                <button onclick="switchProfile('personal')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 transition group"><div class="w-8 h-8 rounded-full bg-cyan-900 flex items-center justify-center text-cyan-400"><i class="fa-solid fa-user"></i></div><span class="text-slate-200">Personal</span></button>
                <button onclick="switchProfile('couple')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 transition group"><div class="w-8 h-8 rounded-full bg-rose-900 flex items-center justify-center text-rose-400"><i class="fa-solid fa-heart"></i></div><span class="text-slate-200">Pareja</span></button>
                <button onclick="switchProfile('roomies')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 transition group"><div class="w-8 h-8 rounded-full bg-orange-900 flex items-center justify-center text-orange-400"><i class="fa-solid fa-house-user"></i></div><span class="text-slate-200">Roomies</span></button>
                <button onclick="switchProfile('business')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 transition group"><div class="w-8 h-8 rounded-full bg-indigo-900 flex items-center justify-center text-indigo-400"><i class="fa-solid fa-briefcase"></i></div><span class="text-slate-200">Negocio</span></button>
                <button onclick="switchProfile('travel')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-700 transition group"><div class="w-8 h-8 rounded-full bg-emerald-900 flex items-center justify-center text-emerald-400"><i class="fa-solid fa-plane"></i></div><span class="text-slate-200">Viaje</span></button>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleModal('modal-settings')"></div>
        <div class="bg-slate-800 w-11/12 md:max-w-sm rounded-xl shadow-2xl z-50 border border-slate-700 max-h-[90vh] overflow-y-auto py-5 px-6 text-left relative">
            <h3 class="text-lg font-bold text-white mb-4">Ajustes</h3>
            <div class="space-y-4">
                <div class="p-3 bg-slate-700/50 rounded-lg border border-slate-600">
                    <label class="block text-sm font-semibold text-slate-300 mb-3">Estilo del Botón</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setFabStyle('flower')" aria-label="Estilo Flor" id="fab-opt-flower" class="fab-option flex flex-col items-center justify-center p-2 rounded-lg border border-slate-600 hover:bg-slate-600 transition"><span class="text-xl">🌺</span></button>
                        <button onclick="setFabStyle('classic')" aria-label="Estilo Clásico" id="fab-opt-classic" class="fab-option flex flex-col items-center justify-center p-2 rounded-lg border border-slate-600 hover:bg-slate-600 transition"><span class="text-xl">🔵</span></button>
                        <button onclick="setFabStyle('crystal')" aria-label="Estilo Cristal" id="fab-opt-crystal" class="fab-option flex flex-col items-center justify-center p-2 rounded-lg border border-slate-600 hover:bg-slate-600 transition"><span class="text-xl">🔮</span></button>
                        <button onclick="setFabStyle('pirate')" aria-label="Estilo Pirata" id="fab-opt-pirate" class="fab-option flex flex-col items-center justify-center p-2 rounded-lg border border-slate-600 hover:bg-slate-600 transition"><span class="text-xl">☠️</span></button>
                    </div>
                </div>
                <div class="p-3 bg-slate-700/50 rounded-lg border border-slate-600">
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Fondo Personalizado</label>
                    <div class="flex gap-2"><button onclick="document.getElementById('bg-file').click()" class="bg-slate-600 hover:bg-slate-500 text-white text-xs px-3 py-2 rounded transition flex-1"><i class="fa-solid fa-image mr-1"></i> Subir</button><button onclick="clearBackground()" aria-label="Borrar fondo" class="bg-red-900/50 text-red-300 text-xs px-3 py-2 rounded"><i class="fa-solid fa-trash"></i></button></div>
                    <input type="file" id="bg-file" class="hidden" accept="image/*" onchange="handleBgUpload(this)">
                </div>
                <div class="flex items-center justify-between p-3 bg-slate-700/50 rounded-lg border border-slate-600">
                    <span class="text-slate-300 font-semibold text-sm">Bloqueo PIN</span>
                    <button id="toggle-pin-btn" onclick="togglePinLock()" aria-label="Activar o desactivar bloqueo con PIN" class="bg-slate-600 w-10 h-6 rounded-full relative transition-colors"><div class="absolute w-4 h-4 bg-white rounded-full top-1 left-1 transition-transform" id="pin-toggle-circle"></div></button>
                </div>
                <button onclick="changePin()" class="w-full bg-slate-600 text-slate-300 py-2 rounded-lg text-xs hover:bg-slate-500">Cambiar PIN</button>
                <div class="border-t border-slate-700 my-2"></div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportCSV()" class="bg-slate-700 text-yellow-400 font-semibold py-2 px-2 rounded-lg text-xs flex items-center justify-center gap-1 hover:bg-slate-600 border border-slate-600"><i class="fa-solid fa-file-csv"></i> Reporte Excel</button>
                    <button onclick="exportData()" class="bg-slate-700 text-cyan-400 font-semibold py-2 px-2 rounded-lg text-xs flex items-center justify-center gap-1 hover:bg-slate-600 border border-slate-600"><i class="fa-solid fa-download"></i> Respaldo JSON</button>
                </div>

                <div class="relative">
                    <input type="file" id="import-file" class="hidden" onchange="importData(this)">
                    <button onclick="document.getElementById('import-file').click()" class="w-full bg-slate-700 text-green-400 font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-slate-600 transition border border-slate-600"><i class="fa-solid fa-upload"></i> Cargar Respaldo</button>
                </div>

                <div class="border-t border-slate-700 my-2"></div>
                <button onclick="toggleModal('modal-settings')" class="w-full bg-slate-900 text-slate-400 font-semibold py-2 px-4 rounded-lg hover:bg-black">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="modal-calculator" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleModal('modal-calculator')"></div>
        <div class="bg-slate-800 w-11/12 md:max-w-sm rounded-xl shadow-2xl z-50 border border-slate-700 py-5 px-6 text-left relative">
            <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold text-white">Calculadora</h3><button onclick="toggleModal('modal-calculator')" aria-label="Cerrar calculadora" class="text-slate-500"><i class="fa-solid fa-times"></i></button></div>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div><label for="calc-amount" class="block text-sm font-semibold text-slate-400 mb-1">Precio</label><input type="number" id="calc-amount" placeholder="0.00" class="input-dark mt-1 block w-full rounded-lg border shadow-sm p-3 font-bold text-white" oninput="calculateMSI()"></div>
                <div><label for="calc-discount" class="block text-sm font-semibold text-slate-400 mb-1">Desc %</label><input type="number" id="calc-discount" placeholder="0" class="input-dark mt-1 block w-full rounded-lg border shadow-sm p-3 font-bold text-yellow-400" oninput="calculateMSI()"></div>
            </div>
            <div class="bg-slate-700/50 p-4 rounded-lg border border-slate-600 mb-4 text-center"><p class="text-sm text-slate-400">Total a Pagar</p><p class="text-3xl font-bold text-green-400" id="calc-final">$0.00</p></div>
            <div class="space-y-2 text-sm text-slate-300 max-h-48 overflow-y-auto" id="msi-results"></div>
        </div>
    </div>

    <div id="modal-card-form" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" style="z-index: 40;"></div>
        <div class="bg-slate-800 w-11/12 md:max-w-md rounded-xl shadow-2xl z-50 overflow-y-auto max-h-[90vh] border border-slate-700 py-5 px-6 text-left relative">
            <div class="flex justify-between items-center pb-3 border-b border-slate-700 mb-4"><p class="text-lg font-bold text-white" id="modal-card-title">Cuenta</p><div class="modal-close cursor-pointer z-50 bg-slate-700 rounded-full p-2" onclick="toggleModal('modal-card-form')" role="button" aria-label="Cerrar"><i class="fa-solid fa-times text-slate-400"></i></div></div>
            <form id="form-card" class="space-y-4">
                <input type="hidden" id="edit-card-index" value="-1">
                <div><label for="card-name" class="block text-sm font-semibold text-slate-400">Nombre</label><input type="text" id="card-name" class="input-dark mt-1 block w-full rounded-lg border shadow-sm p-3" required></div>
                
                <div><label for="card-category" class="block text-sm font-semibold text-slate-400">Categoría</label><select id="card-category" onchange="toggleDateInputs()" class="input-dark mt-1 block w-full rounded-lg border shadow-sm p-3">
                    <option value="credit">💳 Tarjeta Crédito</option>
                    <option value="departmental">🛍️ Departamental</option>
                    <option value="debit">🏦 Débito / Efectivo</option>
                    <option value="bnpl">📱 Crédito Digital (BNPL)</option>
                    <option value="service">💡 Servicios (Luz/Net)</option>
                    <option value="loan">💸 Préstamo</option>
                    <option value="rent">🏠 Renta</option>
                    <option value="investment">📈 Inversión</option>
                </select></div>
                
                <div id="limit-container"><label for="card-limit" class="block text-sm font-semibold text-red-400">Límite de Crédito ($)</label><input type="number" id="card-limit" class="input-dark mt-1 block w-full rounded-lg border border-slate-600 p-3"></div>
                <div id="loan-amount-container" class="hidden"><label for="card-original" class="block text-sm font-semibold text-orange-400">Monto del Préstamo ($)</label><input type="number" id="card-original" class="input-dark mt-1 block w-full rounded-lg border border-orange-700 p-3"></div>
                <div id="goal-container" class="hidden"><label for="card-goal" class="block text-sm font-semibold text-green-400">Meta ($)</label><input type="number" id="card-goal" class="input-dark mt-1 block w-full rounded-lg border border-green-700 p-3"></div>
                <div id="frequency-container" class="hidden"><label for="card-frequency" class="block text-sm font-semibold text-blue-400">Frecuencia de Pago</label><select id="card-frequency" class="input-dark mt-1 block w-full rounded-lg border border-blue-700 p-3"><option value="monthly">Mensual</option><option value="biweekly">Quincenal</option><option value="weekly">Semanal</option></select></div>
                <div id="service-amount-container" class="hidden"><label for="card-fixed" class="block text-sm font-semibold text-yellow-400">Monto Fijo (Opcional)</label><input type="number" id="card-fixed" class="input-dark mt-1 block w-full rounded-lg border border-yellow-700 p-3"></div>

                <div class="grid grid-cols-2 gap-4"><div><label for="card-network" class="block text-sm font-semibold text-slate-400">Red</label><select id="card-network" class="input-dark mt-1 block w-full rounded-lg border shadow-sm p-3"><option value="visa">Visa</option><option value="mastercard">Mastercard</option><option value="amex">Amex</option><option value="other">Otro</option></select></div><div><label for="card-color" class="block text-sm font-semibold text-slate-400">Color</label><div class="flex items-center mt-1"><input type="color" id="card-color" value="#1e293b" class="h-12 w-full rounded-lg border-slate-600 bg-slate-700 p-1"></div></div></div>
                
                <div class="grid grid-cols-2 gap-4" id="dates-container">
                    <div id="cutoff-group"><label for="card-cutoff" id="lbl-cutoff" class="block text-sm font-semibold text-slate-400">Corte</label><input type="number" id="card-cutoff" min="0" max="31" class="input-dark mt-1 block w-full rounded-lg border shadow-sm p-3"></div>
                    <div id="payment-group"><label for="card-payment" id="lbl-payment" class="block text-sm font-semibold text-slate-400">Pago</label><input type="number" id="card-payment" min="0" max="31" class="input-dark mt-1 block w-full rounded-lg border shadow-sm p-3"></div>
                </div>
                
                <div class="pt-4 flex space-x-3"><button type="button" id="btn-delete-card" onclick="deleteCard()" class="hidden w-1/3 bg-red-900/50 text-red-400 font-bold py-3 px-4 rounded-lg border border-red-800">Borrar</button><button type="submit" class="w-full bg-accent text-slate-900 font-bold py-3 px-4 rounded-lg shadow-lg" id="btn-save-card">Guardar</button></div>

        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" style="z-index: 40;"></div>

            <div class="bg-green-900/30 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-800"><i class="fa-solid fa-circle-check text-green-500 text-5xl"></i></div>
            <h3 class="text-xl font-bold mb-2 text-white">¿Liquidar?</h3><p class="text-slate-400 mb-6">Saldo a $0.00 para: <span id="pay-card-name" class="font-bold text-accent"></span></p>

    <div id="modal-history" class="modal opacity-0 pointer-events-none fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleModal('modal-history')"></div>
        <div class="bg-slate-800 w-11/12 md:max-w-md rounded-xl shadow-2xl z-50 h-[80vh] flex flex-col border border-slate-700 relative">
            <div class="modal-header py-4 px-6 border-b border-slate-700 flex justify-between items-center bg-slate-900 rounded-t-xl"><div><p class="text-xs font-bold text-slate-500 uppercase">Historial</p><h3 class="text-xl font-bold text-white" id="history-card-name">Tarjeta</h3></div><button onclick="toggleModal('modal-history')" aria-label="Cerrar historial" class="text-slate-500 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button></div>
            <div class="modal-content flex-1 overflow-y-auto p-4 bg-slate-800" id="history-list"></div>

    <script>
        // --- VARIABLES GLOBALES ---
        let allCards = JSON.parse(localStorage.getItem('myFinanceCards')) || [];
        let currentProfile = 'personal';
        let isPrivacyMode = false;
        let financeChart = null;
        let currentFab = localStorage.getItem('fabStyle') || 'flower'; 
        let userPin = localStorage.getItem('userPin') || '0000';
        let isPinEnabled = localStorage.getItem('isPinEnabled') === 'true'; 
        let enteredPin = '';
        
        // --- DATOS EDUCATIVOS (ACADEMIA EXPERTA) ---
        const educationalData = [
            { id: 'credito', title: 'Maestría en T.C.', icon: 'fa-credit-card', content: `<div class="academy-article"><h4 class="text-accent">Fechas Clave</h4><p><b>Fecha de Corte:</b> El día que el banco dice "cierra la cuenta". Todo lo que gastaste antes de este día, entra en este periodo.</p><p><b>Fecha de Pago:</b> Tienes 20 días después del corte para pagar. Si pagas el día 21, ¡Intereses!</p><h4 class="text-accent">El Secreto del Totalero</h4><p>Para nunca pagar intereses: Paga siempre el monto que dice <strong>"Pago para no generar intereses"</strong> antes de la fecha límite. Ignora el "Pago Mínimo", es una trampa.</p></div>`, quiz: { q: "¿Qué monto debes pagar para evitar intereses?", a: ["Pago Mínimo", "Saldo al Corte / Para no generar intereses", "Saldo Total (Histórico)"], correct: 1 } },
            { id: 'bnpl', title: 'Crédito Digital (BNPL)', icon: 'fa-mobile-screen-button', content: `<div class="academy-article"><h4 class="text-accent">¿Kueski, Aplazo, MercadoPago?</h4><p>Estas apps (Buy Now, Pay Later) te prestan dinero sin tarjeta. Pero ojo: su modelo de negocio son los <strong>intereses moratorios</strong>.</p><h4 class="text-accent">La Trampa de las Quincenas</h4><p>Si te atrasas 1 día en Kueski, te cobran interés + IVA. En MercadoPago, si eliges muchas mensualidades, puedes terminar pagando el doble del producto. Úsalos solo si puedes liquidar en menos de 30 días.</p></div>`, quiz: { q: "¿Cuál es el principal riesgo del BNPL?", a: ["No te dan puntos", "Intereses moratorios altos", "Es difícil de usar"], correct: 1 } },
            { id: 'sat', title: 'SAT & Impuestos 2025', icon: 'fa-scale-balanced', content: `<div class="academy-article"><h4 class="text-accent">Discrepancia Fiscal</h4><p>El SAT sabe cuánto gastas en tus tarjetas. Si declaras ganar $10,000 pero gastas $50,000 en crédito, el SAT asume que tienes ingresos ocultos y te cobrará ISR sobre la diferencia.</p><h4 class="text-accent">Mitos</h4><p>¿Pagar en efectivo evita al SAT? Si depositas ese efectivo en tu cuenta o pagas tu tarjeta con efectivo, ¡sigue siendo rastreable!</p></div>`, quiz: { q: "¿Qué es discrepancia fiscal?", a: ["Gastar más de lo que declaras", "Perder tu e.firma", "No facturar gasolina"], correct: 0 } },
            { id: 'inversiones', title: 'Inversiones Básicas', icon: 'fa-chart-line', content: `<div class="academy-article"><h4 class="text-accent">Dinero Dormido = Pérdida</h4><p>Si tienes $10,000 en tu cuenta de nómina, la inflación hace que valga menos cada día.</p><h4 class="text-accent">GAT Real</h4><p>Es la Ganancia Anual Total Real. Si un banco te da 10% de rendimiento, pero la inflación es 4%, tu GAT Real es 6%. Busca siempre instrumentos como Cetes o Sofipos que superen la inflación.</p></div>`, quiz: { q: "¿Qué afecta el valor real de tu ahorro?", a: ["El banco", "La inflación", "El horario"], correct: 1 } }
        ];

        // --- FUNCIONES INICIALES ---
        function initApp() {
            const lockScreen = document.getElementById('pin-lock-screen');
            if (isPinEnabled) {
                lockScreen.style.display = 'flex';
                lockScreen.setAttribute('aria-hidden', 'false');
            } else {
                lockScreen.setAttribute('aria-hidden', 'true');
            }

            let changesMade = false;
            if (allCards.length > 0) {
                allCards = allCards.map(c => {
                    if(!c.context) { c.context = 'personal'; changesMade = true; }
                    if(!c.category) { c.category = 'credit'; changesMade = true; }
                    if(!c.transactions) { c.transactions = []; changesMade = true; }
                    if(typeof c.balance !== 'number') { c.balance = 0; changesMade = true; }
                    if(!c.originalAmount) c.originalAmount = 0;
                    if(!c.limit) c.limit = 0;
                    if(!c.goal) c.goal = 0;
                    if(!c.frequency) c.frequency = 'monthly'; 
                    return c;
                });
                if(changesMade) localStorage.setItem('myFinanceCards', JSON.stringify(allCards));
            }

            renderFab();
            applyTheme();
            renderCards();
            updateTotal();
            initIcons();
            renderAcademyList();
        }

        // --- ACADEMIA LOGIC ---
        function renderAcademyList() {
            const container = document.getElementById('academy-content');
            let html = '<div class="space-y-3">';
            educationalData.forEach((topic, idx) => {
                html += `<div onclick="openTopic(${idx})" class="bg-slate-700/50 p-4 rounded-lg border border-slate-600 flex items-center gap-4 cursor-pointer hover:bg-slate-700 transition group"><div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-accent text-xl group-hover:scale-110 transition"><i class="fa-solid ${topic.icon}"></i></div><div><h4 class="font-bold text-white text-sm">${topic.title}</h4><p class="text-xs text-slate-400">Leer módulo <i class="fa-solid fa-arrow-right ml-1 text-accent"></i></p></div></div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function openTopic(idx) {
            const topic = educationalData[idx];
            const container = document.getElementById('academy-content');
            container.innerHTML = `<button onclick="renderAcademyList()" class="mb-4 text-xs text-accent font-bold flex items-center gap-1 hover:underline"><i class="fa-solid fa-arrow-left"></i> Volver a Temas</button><h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid ${topic.icon} text-accent"></i> ${topic.title}</h3><div class="mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700">${topic.content}</div><div class="bg-slate-800 p-4 rounded-lg border border-slate-600"><p class="text-sm font-bold text-white mb-3 flex items-center gap-2"><i class="fa-solid fa-brain text-yellow-400"></i> Quiz Rápido: ${topic.quiz.q}</p><div class="space-y-2">${topic.quiz.a.map((ans, i) => `<button onclick="checkAnswer(${idx}, ${i})" class="w-full text-left p-3 rounded-lg bg-slate-700 text-slate-200 text-sm hover:bg-accent hover:text-slate-900 transition border border-slate-600">${ans}</button>`).join('')}</div></div>`;
        }

        function checkAnswer(topicIdx, ansIdx) {
            if(educationalData[topicIdx].quiz.correct === ansIdx) { 
                if (typeof confetti !== 'undefined') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#22d3ee', '#f43f5e', '#fbbf24'] }); 
                alert("¡Correcto! 🏴‍☠️ Has ganado conocimiento."); renderAcademyList(); 
            } 
            else { alert("Incorrecto. Intenta de nuevo, grumete."); }
        }

        // --- FAB RENDER ---
        const fabTemplates = {
            flower: `<div id="draggable-fab" style="right: 20px; bottom: 80px;" class="w-24 h-24 flex items-center justify-center"><svg viewBox="0 0 100 100" class="w-full h-full" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="pgv" cx="50%" cy="50%" r="60%" fx="50%" fy="50%"><stop offset="30%" stop-color="#6b21a8"/><stop offset="85%" stop-color="#a855f7"/><stop offset="100%" stop-color="#c084fc"/></radialGradient><filter id="psh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="0" dy="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#psh)"><path id="fp" d="M50 60 Q 25 20, 50 5 Q 75 20, 50 60 M50 60 Q 25 20, 50 5 Q 75 20, 50 60" fill="url(#pgv)" /><use href="#fp" transform="rotate(72, 50, 55)" /><use href="#fp" transform="rotate(144, 50, 55)" /><use href="#fp" transform="rotate(216, 50, 55)" /><use href="#fp" transform="rotate(288, 50, 55)" /></g><circle cx="50" cy="53" r="14" fill="#4c1d95" /><circle cx="50" cy="53" r="8" fill="#facc15" /><path d="M50 47 L50 59 M44 53 L56 53" stroke="#854d0e" stroke-width="2.5" stroke-linecap="round" /></svg></div>`,
            classic: `<div id="draggable-fab" style="right: 20px; bottom: 80px;" class="w-16 h-16 rounded-full bg-accent flex items-center justify-center shadow-lg border-2 border-white/20"><i class="fa-solid fa-plus text-3xl text-slate-900"></i></div>`,
            crystal: `<div id="draggable-fab" style="right: 20px; bottom: 80px;" class="w-20 h-20 rounded-full flex items-center justify-center border border-white/40" style="background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), transparent 60%), radial-gradient(circle at 50% 50%, #22d3ee, #be123c); box-shadow: 0 0 20px rgba(34,211,238,0.5);"><i class="fa-solid fa-plus text-3xl text-white drop-shadow-md"></i></div>`,
            pirate: `<div id="draggable-fab" style="right: 20px; bottom: 80px;" class="w-16 h-16 rounded-full bg-black flex items-center justify-center shadow-xl border-2 border-yellow-500"><i class="fa-solid fa-skull text-3xl text-yellow-500"></i></div>`
        };
        function setFabStyle(s) { currentFab=s; localStorage.setItem('fabStyle',s); renderFab(); }
        function renderFab() { const c = document.getElementById('draggable-fab-container'); if(c) { c.innerHTML = fabTemplates[currentFab] || fabTemplates['flower']; initDraggable(); } }
        function initDraggable() {
            const fab = document.getElementById('draggable-fab'); if(!fab) return;
            let isDragging=false, startX, startY, initialRight, initialBottom, movedTotal=0;
            const savedPos = JSON.parse(localStorage.getItem('fabPosition')); if (savedPos) { fab.style.right = savedPos.right; fab.style.bottom = savedPos.bottom; }
            const onStart=(e)=>{isDragging=true;movedTotal=0;const r=fab.getBoundingClientRect();startX=e.clientX;startY=e.clientY;initialRight=window.innerWidth-r.right;initialBottom=window.innerHeight-r.bottom;};
            const onMove=(e)=>{if(!isDragging)return;const x=e.clientX||0;const y=e.clientY||0;const dx=startX-x;const dy=startY-y;movedTotal+=Math.abs(dx)+Math.abs(dy);fab.style.right=`${initialRight+dx}px`;fab.style.bottom=`${initialBottom+dy}px`;};
            const onEnd=(e)=>{ if(!isDragging)return; isDragging=false; if(movedTotal<10) openExpenseModal(); else localStorage.setItem('fabPosition',JSON.stringify({right:fab.style.right,bottom:fab.style.bottom})); };
            fab.onmousedown=onStart; document.onmousemove=onMove; document.onmouseup=onEnd;
            fab.ontouchstart=(e)=>onStart(e.touches[0]); document.ontouchmove=(e)=>onMove(e.touches[0]); document.ontouchend=onEnd;
        }

        // --- RENDERIZADO DE TARJETAS ---
        function renderCards() {
            const container = document.getElementById('cards-container');
            const select = document.getElementById('expense-card-id');
            container.innerHTML = ''; select.innerHTML = '<option value="" disabled selected>Selecciona...</option>';

            const visibleCards = allCards.filter(c => c.context === currentProfile);

            if (visibleCards.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-600"><i class="fa-solid fa-wallet text-4xl mb-3 opacity-30"></i><p>No hay cuentas en ${currentProfile}.</p></div>`;
                return;
            }

            visibleCards.forEach((card) => {
                const realIndex = allCards.indexOf(card);
                const option = document.createElement('option'); option.value = realIndex; option.text = card.name; select.appendChild(option);
                
                const status = getStatus(card);
                const bal = formatMoney(card.balance);
                let iconClass = 'fa-credit-card';
                if(card.category==='investment') iconClass='fa-chart-line';
                else if(card.category==='loan') iconClass='fa-hand-holding-dollar';
                else if(card.category==='rent') iconClass='fa-house';
                else if(card.category==='debit') iconClass='fa-money-bill-1-wave';
                else if(card.category==='bnpl') iconClass='fa-mobile-screen-button';
                else if(card.category==='service') iconClass='fa-lightbulb';
                else if(card.category==='departmental') iconClass='fa-bag-shopping';
                
                const gradientBg = `background: linear-gradient(135deg, ${card.color || '#1e293b'}, #020617);`;
                
                let footer = '', progressHTML = '';
                const isAsset = (card.category === 'investment' || card.category === 'debit');

                if (isAsset) {
                     if (card.category === 'investment' && card.goal > 0) {
                         const p = Math.min((card.balance/card.goal)*100, 100); 
                         progressHTML = `<div class="w-full mt-3 bg-black/40 rounded-full h-2 overflow-hidden border border-white/10"><div class="bg-yellow-400 h-full rounded-full" style="width: ${p}%"></div></div><p class="text-[10px] text-yellow-200 mt-1 text-right">Meta: ${formatMoney(card.goal)} (${Math.round(p)}%)</p>`;
                     }
                     footer = `<div class="flex flex-col w-full relative z-10"><div class="flex justify-between items-end border-t border-white/20 pt-3"><div><p class="text-[10px] text-green-300 uppercase">Saldo Disponible</p><p class="font-semibold text-sm text-green-100">Activo</p></div><div class="flex gap-2"><button onclick="openQuickAdd(${realIndex})" class="bg-white/20 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md border border-white/20"><i class="fa-solid fa-plus text-xs"></i></button><button onclick="openHistoryModal(${realIndex})" class="text-white/80 hover:text-white"><i class="fa-solid fa-list-ul text-xl"></i></button></div></div>${progressHTML}</div>`;
                } else {
                     if (card.limit > 0 && (card.category === 'credit' || card.category === 'departmental' || card.category === 'bnpl')) {
                         const p = Math.min((card.balance/card.limit)*100, 100); 
                         let c="bg-green-500"; if(p>30)c="bg-yellow-400"; if(p>70)c="bg-red-500"; 
                         progressHTML = `<div class="w-full mt-3 bg-black/40 rounded-full h-2 overflow-hidden border border-white/10"><div class="${c} h-full rounded-full transition-all duration-500" style="width: ${p}%"></div></div><div class="flex justify-between text-[10px] text-slate-300 mt-1"><span>Disp: ${formatMoney(card.limit-card.balance)}</span><span>Lim: ${formatMoney(card.limit)}</span></div>`;
                     }
                     const actionLabel = card.category === 'service' ? 'Pagar' : 'Liquidar';
                     footer = `<div class="flex flex-col w-full relative z-10"><div class="flex justify-between items-end border-t border-white/20 pt-3"><div class="flex space-x-3 items-center"><div><p class="text-[10px] text-gray-300 uppercase tracking-wider">${status.statusLabel}</p><p class="font-semibold text-sm">${status.paymentString}</p></div><button onclick="addToCalendar(${realIndex})" class="text-white/80 hover:text-white"><i class="fa-regular fa-calendar-plus text-xl"></i></button></div><div class="flex gap-2"><button onclick="openQuickAdd(${realIndex})" class="bg-white/20 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md border border-white/20"><i class="fa-solid fa-plus text-xs"></i></button><button onclick="openHistoryModal(${realIndex})" class="bg-white/10 text-white p-2 rounded-lg backdrop-blur-md border border-white/10"><i class="fa-solid fa-list-ul"></i></button><button onclick="openPayModal(${realIndex})" class="bg-white/20 text-white text-xs font-bold py-2 px-4 rounded-lg backdrop-blur-md border border-white/20"><i class="fa-solid fa-check mr-1"></i> ${actionLabel}</button></div></div>${progressHTML}</div>`;
                }

                const watermark = `<div class="absolute right-24 top-1/2 transform -translate-y-1/2 opacity-30 pointer-events-none select-none overflow-hidden w-full flex justify-end items-center" style="height: 100%;"><span style="font-family: 'Pirata One', cursive; font-size: 5rem; line-height: 0.9; color: rgba(255,255,255,0.8); transform: rotate(-5deg); text-align: right; word-break: break-word; white-space: nowrap;">${card.name.toUpperCase().substring(0, 12)}</span></div>`;
                const overlay = '<div class="absolute inset-0 bg-black/20 z-0 pointer-events-none"></div>';
                
                const div = document.createElement('div');
                div.className = `card-base rounded-2xl p-6 text-white shadow-lg transform transition hover:scale-[1.01] text-shadow`;
                div.setAttribute('style', gradientBg);
                div.innerHTML = `${watermark}${overlay}<div class="flex justify-between items-start mb-2 relative z-10"><div><p class="font-bold text-lg z-10 relative">${card.name}</p><p class="text-xs ${status.statusColor}"><i class="fa-solid fa-clock mr-1"></i> ${status.statusText}</p></div><div class="flex space-x-2 items-center"><button onclick="openEditModal(${realIndex})" class="text-white/80 hover:text-white bg-black/20 rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-sm"><i class="fa-solid fa-pen text-xs"></i></button><i class="fa-solid ${iconClass} text-3xl opacity-80"></i></div></div><div class="mb-4 relative z-10"><p class="text-xs text-gray-300 uppercase">${isAsset ? 'Saldo' : 'Deuda'}</p><p class="text-3xl font-bold ${isAsset ? 'text-green-300' : 'text-white'} ${isPrivacyMode?'blur-text':''}">${bal}</p></div>${footer}`;
                
                container.appendChild(div);
            });
        }
        
        // --- FORM HANDLERS UPDATED (BNPL Frequency) ---
        function toggleDateInputs() { 
            const cat = document.getElementById('card-category').value; 
            const dates = document.getElementById('dates-container'); 
            const goal = document.getElementById('goal-container'); 
            const limit = document.getElementById('limit-container'); 
            const loan = document.getElementById('loan-amount-container');
            const fixed = document.getElementById('service-amount-container');
            const freq = document.getElementById('frequency-container');

            dates.classList.remove('hidden'); goal.classList.add('hidden'); limit.classList.add('hidden'); loan.classList.add('hidden'); fixed.classList.add('hidden'); freq.classList.add('hidden');
            
            if(cat==='investment' || cat==='debit'){ dates.classList.add('hidden'); if(cat==='investment') goal.classList.remove('hidden'); }
            if(cat==='rent' || cat==='service') { 
                document.getElementById('lbl-payment').innerText="Fecha Pago"; 
                document.getElementById('cutoff-group').classList.add('hidden');
                if(cat==='service') fixed.classList.remove('hidden');
            } else {
                document.getElementById('lbl-payment').innerText="Día Pago"; 
                document.getElementById('cutoff-group').classList.remove('hidden');
            }
            if(cat==='credit'||cat==='departmental') limit.classList.remove('hidden'); 
            if(cat==='loan') loan.classList.remove('hidden');
            if(cat==='bnpl' || cat==='loan') {
                freq.classList.remove('hidden');
                if(cat==='bnpl') limit.classList.remove('hidden'); 
            }
        }

        // --- UTILS, THEME & CORE ---
        const profileColors = { 'personal': '#22d3ee', 'couple': '#f43f5e', 'roomies': '#f97316', 'business': '#6366f1', 'travel': '#10b981' };
        const profileIcons = { 'personal': 'fa-user', 'couple': 'fa-heart', 'roomies': 'fa-house-user', 'business': 'fa-briefcase', 'travel': 'fa-plane' };
        
        function applyTheme() {
            const color = profileColors[currentProfile] || '#22d3ee';
            const iconClass = profileIcons[currentProfile] || 'fa-user';
            const labels = { 'personal': 'Personal', 'couple': 'Pareja', 'roomies': 'Roomies', 'business': 'Negocio', 'travel': 'Viaje' };
            document.documentElement.style.setProperty('--accent-color', color);
            const pIcon = document.getElementById('profile-icon'); if(pIcon) pIcon.className = `fa-solid ${iconClass} text-accent text-sm`;
            const pLabel = document.getElementById('profile-label'); if(pLabel) pLabel.innerText = labels[currentProfile];
            const bTitle = document.getElementById('balance-title'); if(bTitle) bTitle.innerText = `Balance ${labels[currentProfile]}`;
            document.querySelectorAll('.fab-option').forEach(btn => btn.classList.remove('selected'));
            const selFab = document.getElementById(`fab-opt-${currentFab}`); if(selFab) selFab.classList.add('selected');
        }

        function switchProfile(p) { currentProfile = p; toggleModal('modal-profiles'); applyTheme(); renderCards(); updateTotal(); }
        function saveCards() { localStorage.setItem('myFinanceCards', JSON.stringify(allCards)); renderCards(); updateTotal(); }
        function formatMoney(amount) { if (isPrivacyMode) return "****"; return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount); }
        function togglePrivacy() { isPrivacyMode = !isPrivacyMode; renderCards(); updateTotal(); }
        
        function updateTotal() {
            let totalDebt = 0; let totalInvest = 0;
            const visibleCards = allCards.filter(c => c.context === currentProfile);
            visibleCards.forEach(c => { 
                if(c.category === 'investment' || c.category === 'debit') totalInvest += c.balance; 
                else totalDebt += c.balance; 
            });
            const net = totalInvest - totalDebt;
            document.getElementById('total-debt').innerText = formatMoney(totalDebt);
            document.getElementById('total-invest').innerText = formatMoney(totalInvest);
            const netEl = document.getElementById('total-net');
            netEl.innerText = formatMoney(net);
            netEl.className = `text-xs font-bold amount-display ${net >= 0 ? 'text-green-400' : 'text-red-500'}`;
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (financeChart) { financeChart.data.datasets[0].data = [totalDebt, totalInvest]; financeChart.update(); } 
            else { financeChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Deuda', 'Activos'], datasets: [{ data: [totalDebt, totalInvest], backgroundColor: ['#ef4444', '#22c55e'], borderColor: '#1e293b', borderWidth: 2, hoverOffset: 4 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { display: false } } } }); }
        }

        const MONTH_NAMES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
        function getStatus(card) {
            if(card.category === 'investment' || card.category === 'debit') return { statusText: "Activo", statusColor: "text-green-400", cutoffString: "--", paymentString: "--", gCalDate: null };
            const today = new Date(); const currentYear = today.getFullYear(); const currentMonth = today.getMonth();
            let nextPaymentDate = null; let statusLabel = "Límite Pago"; 
            
            let payDay = card.payment || 1;
            
            if (card.category === 'bnpl' || card.category === 'loan') {
                statusLabel = "Próximo Pago";
                if (card.frequency === 'biweekly') {
                    if (today.getDate() < 15) nextPaymentDate = new Date(currentYear, currentMonth, 15);
                    else if (today.getDate() < 30) nextPaymentDate = new Date(currentYear, currentMonth, 30);
                    else nextPaymentDate = new Date(currentYear, currentMonth + 1, 15);
                } else if (card.frequency === 'weekly') {
                    const diff = (5 + 7 - today.getDay()) % 7; 
                    nextPaymentDate = new Date(today);
                    nextPaymentDate.setDate(today.getDate() + (diff === 0 ? 7 : diff));
                } else {
                    nextPaymentDate = new Date(currentYear, currentMonth, payDay);
                    if (today.getDate() > payDay) nextPaymentDate.setMonth(nextPaymentDate.getMonth() + 1);
                }
            } else if (card.category === 'rent' || card.category === 'service') { 
                statusLabel = "Vence"; 
                nextPaymentDate = new Date(currentYear, currentMonth, payDay); 
                if (today.getDate() > payDay) nextPaymentDate.setMonth(nextPaymentDate.getMonth() + 1); 
            } else { 
                let nextCutoffDate = new Date(currentYear, currentMonth, card.cutoff || 1);
                if (today.getDate() > (card.cutoff || 1)) nextCutoffDate.setMonth(nextCutoffDate.getMonth() + 1);
                nextPaymentDate = new Date(nextCutoffDate.getFullYear(), nextCutoffDate.getMonth(), card.payment || 1);
                if ((card.payment || 1) < (card.cutoff || 1)) nextPaymentDate.setMonth(nextPaymentDate.getMonth() + 1);
            }
            
            let daysDiff = Math.ceil((nextPaymentDate - today) / (1000 * 60 * 60 * 24));
            let statusText = daysDiff <= 0 ? "¡HOY!" : (daysDiff <= 3 ? `En ${daysDiff} días` : `Faltan ${daysDiff} días`);
            let statusColor = daysDiff <= 3 ? "text-orange-400 font-bold" : "text-slate-400";
            const fmt = (d) => d.toISOString().split("T")[0].replace(/-/g,""); 
            return { statusText, statusColor, paymentString: `${nextPaymentDate.getDate()} ${MONTH_NAMES[nextPaymentDate.getMonth()]}`, gCalDate: fmt(nextPaymentDate), statusLabel };
        }

        function addToCalendar(index) {
            const card = allCards[index]; const status = getStatus(card); if(!status.gCalDate) return;
            const title = `Pago: ${card.name}`; const details = `Monto estimado: $${new Intl.NumberFormat('es-MX').format(card.balance)}.`;
            const url = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${status.gCalDate}/${status.gCalDate}&details=${encodeURIComponent(details)}`;
            window.open(url, '_blank');
        }
        function openSettings() { updatePinToggleUI(); setFabStyle(currentFab); toggleModal('modal-settings'); }

        // PIN & Export
        function unlockApp() { document.getElementById('pin-lock-screen').style.transform = 'translateY(-100%)'; setTimeout(() => { document.getElementById('pin-lock-screen').style.display = 'none'; }, 300); }
        function enterDigit(d) { if(enteredPin.length < 4) { enteredPin += d; updatePinDots(); if(enteredPin.length===4) setTimeout(checkPin,200); } }
        function deleteDigit() { enteredPin = enteredPin.slice(0,-1); updatePinDots(); }
        function updatePinDots() { for(let i=1;i<=4;i++) document.getElementById(`dot-${i}`).classList.toggle('active', i<=enteredPin.length); }
        function checkPin() { if(enteredPin===userPin){ unlockApp(); enteredPin=''; updatePinDots(); } else { alert("Error"); enteredPin=''; updatePinDots(); } }
        function changePin() { const c=prompt("PIN actual:"); if(c===userPin){const n=prompt("Nuevo PIN:");if(n&&n.length===4&&!isNaN(n)){userPin=n;localStorage.setItem('userPin',n);alert("OK");}else alert("4 dígitos");}else alert("Error"); }
        function togglePinLock() { isPinEnabled=!isPinEnabled; localStorage.setItem('isPinEnabled', isPinEnabled); updatePinToggleUI(); }
        function updatePinToggleUI() { const c=document.getElementById('pin-toggle-circle'); const b=document.getElementById('toggle-pin-btn'); if(isPinEnabled) { c.style.transform='translateX(100%)'; b.classList.remove('bg-slate-600'); b.classList.add('bg-green-500'); } else { c.style.transform='translateX(0)'; b.classList.add('bg-slate-600'); b.classList.remove('bg-green-500'); } }

        function handleBgUpload(i) { const f=i.files[0]; if(f){ const r=new FileReader(); r.onload=(e)=>{localStorage.setItem('customWallpaper', e.target.result); applyBackground(e.target.result);}; r.readAsDataURL(f); } }
        function clearBackground() { localStorage.removeItem('customWallpaper'); applyBackground(null); }
        function applyBackground(d) { const c=document.getElementById('app-wallpaper'); const def=document.getElementById('default-pattern'); if(d){ c.style.backgroundImage=`url('${d}')`; c.style.opacity=0.4; def.style.display='none'; } else { c.style.backgroundImage=''; c.style.opacity=0.15; def.style.display='block'; } }
        const sBg = localStorage.getItem('customWallpaper'); if(sBg) applyBackground(sBg);

        function exportData() { const d="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(allCards)); const a=document.createElement('a'); a.href=d; a.download="respaldo.json"; a.click(); }
        function exportCSV() { let c="data:text/csv;charset=utf-8,Fecha,Cuenta,Cat,Monto\n"; allCards.forEach(card=>{ if(card.transactions) card.transactions.forEach(t=>{ c+=`${new Date(t.date).toLocaleDateString()},${card.name},${card.category},${t.amount}\n`})}); const e=encodeURI(c); const l=document.createElement("a"); l.href=e; l.download="reporte.csv"; l.click(); }
        function importData(i) { const f=i.files[0]; if(!f)return; const r=new FileReader(); r.onload=(e)=>{ try { allCards=JSON.parse(e.target.result); saveCards(); alert("Cargado"); toggleModal('modal-settings'); } catch(err){alert("Error");} }; r.readAsText(f); }
        
        // Handlers
        document.getElementById('form-card').addEventListener('submit', (e) => { 
            e.preventDefault(); const idx = parseInt(document.getElementById('edit-card-index').value); const cat = document.getElementById('card-category').value;
            let cardData = {
                name: document.getElementById('card-name').value, category: cat, network: document.getElementById('card-network').value, color: document.getElementById('card-color').value, 
                cutoff: parseInt(document.getElementById('card-cutoff').value)||0, payment: parseInt(document.getElementById('card-payment').value)||0, goal: parseFloat(document.getElementById('card-goal').value)||0, 
                limit: parseFloat(document.getElementById('card-limit').value)||0, originalAmount: parseFloat(document.getElementById('card-original').value)||0, frequency: document.getElementById('card-frequency').value,
                context: currentProfile, balance: 0, transactions: [] 
            };
            if (idx === -1) { if(cat === 'loan' && cardData.originalAmount > 0) cardData.balance = cardData.originalAmount; allCards.push(cardData); } 
            else { cardData.balance = allCards[idx].balance; cardData.transactions = allCards[idx].transactions; cardData.context = allCards[idx].context; allCards[idx] = cardData; } 
            saveCards(); toggleModal('modal-card-form'); 
        });

        function toggleMSI() { const check = document.getElementById('expense-msi-check'); const opts = document.getElementById('msi-options'); if(check.checked) opts.classList.remove('hidden'); else opts.classList.add('hidden'); }

        document.getElementById('form-add-expense').addEventListener('submit', (e) => { 
            e.preventDefault(); const idx = document.getElementById('expense-card-id').value; const amt = parseFloat(document.getElementById('expense-amount').value); let desc = document.getElementById('expense-desc').value; const icn = document.querySelector('input[name="expense-icon"]:checked')?.value || 'fa-circle';
            const isMSI = document.getElementById('expense-msi-check') ? document.getElementById('expense-msi-check').checked : false;
            if (idx === "" || isNaN(amt)) return;
            if (isMSI) { const m = document.getElementById('expense-msi-months').value; const d = new Date(); d.setMonth(d.getMonth() + parseInt(m)); const endStr = d.toLocaleDateString('es-MX', {month:'short', year:'2-digit'}); desc = `(MSI ${m} m) Fin: ${endStr} - ${desc}`; }
            allCards[idx].balance += amt; allCards[idx].transactions.push({date: new Date(), amount: amt, desc: desc, icon: icn}); saveCards(); toggleModal('modal-add-expense'); e.target.reset(); 
            const msiCheck = document.getElementById('expense-msi-check'); if(msiCheck) { msiCheck.checked = false; document.getElementById('msi-options').classList.add('hidden'); }
        });

        // UTILS (Shared)
        function toggleModal(id) { const m = document.getElementById(id); m.classList.toggle('opacity-0'); m.classList.toggle('pointer-events-none'); document.body.classList.toggle('modal-active'); }
        function openAddModal() { document.getElementById('modal-card-title').innerText = "Nueva Cuenta ("+currentProfile+")"; document.getElementById('edit-card-index').value = "-1"; document.getElementById('form-card').reset(); document.getElementById('card-color').value = profileColors[currentProfile]; toggleDateInputs(); document.getElementById('btn-save-card').innerText="Guardar"; document.getElementById('btn-delete-card').classList.add('hidden'); document.getElementById('btn-save-card').classList.remove('w-2/3'); toggleModal('modal-card-form'); }
        function openEditModal(idx) {
            const c = allCards[idx]; document.getElementById('modal-card-title').innerText = "Editar"; document.getElementById('edit-card-index').value = idx; document.getElementById('card-name').value = c.name; document.getElementById('card-category').value = c.category; document.getElementById('card-network').value = c.network; document.getElementById('card-color').value = c.color; document.getElementById('card-cutoff').value = c.cutoff; document.getElementById('card-payment').value = c.payment; document.getElementById('card-goal').value = c.goal || ''; document.getElementById('card-limit').value = c.limit || ''; document.getElementById('card-original').value = c.originalAmount || ''; if(c.frequency) document.getElementById('card-frequency').value = c.frequency; toggleDateInputs(); document.getElementById('btn-save-card').innerText="Actualizar"; document.getElementById('btn-delete-card').classList.remove('hidden'); document.getElementById('btn-save-card').classList.add('w-2/3'); toggleModal('modal-card-form'); 
        }
        function openQuickAdd(idx) { toggleModal('modal-add-expense'); document.getElementById('expense-card-id').value = idx; }
        function openExpenseModal() { if(allCards.some(c=>c.context===currentProfile)) toggleModal('modal-add-expense'); else { alert("Agrega una cuenta primero"); openAddModal(); } }
        function openPayModal(idx) { cardToPayIndex = idx; document.getElementById('pay-card-name').innerText = allCards[idx].name; toggleModal('modal-pay-card'); }
        let cardToPayIndex = null;
        document.getElementById('confirm-pay-btn').addEventListener('click', () => { if(cardToPayIndex !== null) { allCards[cardToPayIndex].balance = 0; allCards[cardToPayIndex].transactions.push({date: new Date(), amount: 0, desc: "Liquidación", icon: "fa-check-double"}); saveCards(); if(typeof confetti !== 'undefined') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); toggleModal('modal-pay-card'); } });
        function deleteCard() { const idx = parseInt(document.getElementById('edit-card-index').value); if(confirm("¿Borrar?")) { allCards.splice(idx,1); saveCards(); toggleModal('modal-card-form'); } }
        
        function openHistoryModal(idx) { 
            const c = allCards[idx]; document.getElementById('history-card-name').innerText = c.name; 
            const list = document.getElementById('history-list'); list.innerHTML=''; 
            if(c.transactions.length===0) list.innerHTML='<p class="text-center text-slate-500 py-10">Vacío</p>'; 
            else { [...c.transactions].reverse().forEach((t, i) => { const originalIndex = c.transactions.length - 1 - i; const date = new Date(t.date).toLocaleDateString('es-MX', {day:'numeric', month:'short'}); const isPositive = t.amount > 0; const colorClass = isPositive ? 'text-white' : 'text-green-400'; const item=document.createElement('div'); item.className="bg-slate-700/50 p-3 rounded-lg shadow-sm border border-slate-600 flex justify-between items-center mb-2"; item.innerHTML=`<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-slate-600 flex items-center justify-center text-accent"><i class="fa-solid ${t.icon||'fa-circle'}"></i></div><div><p class="text-xs text-slate-400">${date}</p><p class="font-semibold text-slate-200 text-sm">${t.desc||'Movimiento'}</p></div></div><div class="flex items-center gap-3"><span class="font-bold ${colorClass}">${formatMoney(t.amount)}</span><button onclick="deleteTransaction(${idx}, ${originalIndex})" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button></div>`; list.appendChild(item); }); } toggleModal('modal-history'); 
        }
        function deleteTransaction(cIdx, tIdx) { if(confirm("¿Eliminar?")) { allCards[cIdx].balance -= allCards[cIdx].transactions[tIdx].amount; allCards[cIdx].transactions.splice(tIdx,1); saveCards(); openHistoryModal(cIdx); } }
        function initIcons() { const g=document.getElementById('icon-grid'); if(g){ const i=[{id:'food',icon:'fa-utensils'},{id:'car',icon:'fa-car'},{id:'shop',icon:'fa-bag-shopping'},{id:'home',icon:'fa-house'},{id:'ent',icon:'fa-gamepad'},{id:'health',icon:'fa-notes-medical'},{id:'bill',icon:'fa-file-invoice-dollar'},{id:'transfer',icon:'fa-money-bill-transfer'},{id:'saving',icon:'fa-piggy-bank'},{id:'other',icon:'fa-ellipsis'}]; let h=''; i.forEach(k=>{ h+=`<div class="text-center"><input type="radio" name="expense-icon" id="icon-${k.id}" value="${k.icon}" class="hidden cat-radio" ${k.id==='other'?'checked':''}><label for="icon-${k.id}" class="block p-3 rounded-lg border border-slate-600 bg-slate-700 text-slate-400 cursor-pointer hover:bg-slate-600 transition flex items-center justify-center"><i class="fa-solid ${k.icon}"></i></label></div>`}); g.innerHTML=h; } }
        function calculateMSI() { const amt=parseFloat(document.getElementById('calc-amount').value)||0; const disc=parseFloat(document.getElementById('calc-discount').value)||0; const final=amt-(amt*(disc/100)); document.getElementById('calc-final').innerText=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(final); const res=document.getElementById('msi-results'); if(final<=0){res.innerHTML='...';return;} let h='<div class="grid grid-cols-2 gap-2">'; [3,6,9,12,18,24].forEach(m=>{h+=`<div class="bg-slate-700 p-2 rounded flex justify-between text-xs"><span class="text-slate-300">${m} msi</span><span class="text-cyan-400 font-bold">$${(final/m).toFixed(2)}</span></div>`}); res.innerHTML=h+'</div>'; }
        function calculateAmount() { try { const v=document.getElementById('expense-amount').value.replace(/[^0-9\+\-\*\/\.]/g,''); if(v) document.getElementById('expense-amount').value=eval(v).toFixed(2); } catch(e){} }
        function runDataRepair() { if(confirm("¿Reparar datos?")) { allCards = allCards.map(c => { c.context = 'personal'; return c; }); saveCards(); alert("Datos reparados."); toggleModal('modal-settings'); } }

        // --- ARRANQUE ---
        initApp(); // Inicia todo

    </script>
